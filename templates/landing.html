<!DOCTYPE html>
<html lang="ar">
<!--
  NOTE: NO dir="rtl" on <html> — it flips flex-end to the LEFT side visually.
  RTL is applied per-element via dir="auto" so Arabic text flows correctly
  without breaking the layout positioning.
-->
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Saira:wght@700;800&display=swap" rel="stylesheet">
  {{ACCENT_STYLE_BLOCK}}
  <style>
    /* Fallback accent vars if template placeholder not replaced */
    :root {
      --accent: #6c47ff;
      --accent-a06: rgba(108,71,255,0.06);
      --accent-a12: rgba(108,71,255,0.12);
      --accent-a45: rgba(108,71,255,0.45);
      --accent-a65: rgba(108,71,255,0.65);
      --accent-dark: rgb(38,14,166);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ─── Full-screen base — never scrollable ─── */
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
    }
    body { font-family: 'Lalezar', sans-serif; background: #03001e; }

    /* ─── Root container ─── */
    .main {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* respect mobile browser chrome */
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* ══════════════════════════════════
       BACKGROUND
    ══════════════════════════════════ */
    .bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .bg-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .has-image  .bg-img { background-image: var(--bg-url); }
    .no-image   .bg-img { background: radial-gradient(ellipse at 30% 50%, #1a0a4a 0%, #03001e 70%); }

    /* Directional gradient — panel-right (default): image left, dark right */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to left,
        rgba(2,0,20,1.00)  0%,
        rgba(2,0,20,0.95) 15%,
        rgba(2,0,20,0.75) 38%,
        rgba(2,0,20,0.20) 62%,
        rgba(2,0,20,0.00) 100%
      );
    }
    /* panel-left: image right, dark left */
    .panel-left .bg-overlay {
      background: linear-gradient(
        to right,
        rgba(2,0,20,1.00)  0%,
        rgba(2,0,20,0.95) 15%,
        rgba(2,0,20,0.75) 38%,
        rgba(2,0,20,0.20) 62%,
        rgba(2,0,20,0.00) 100%
      );
    }

    /* Bottom vignette always */
    .bg-vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(2,0,20,0.55) 0%, transparent 35%);
    }

    /* Atmospheric glow */
    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.3;
      pointer-events: none;
    }
    .glow-1 { width: 480px; height: 480px; background: var(--accent-dark); top: -80px;  right: 8%; }
    .glow-2 { width: 280px; height: 280px; background: var(--accent);     bottom: -40px; right: 18%; }
    .panel-left .glow-1 { right: auto; left: 8%; }
    .panel-left .glow-2 { right: auto; left: 18%; }

    /* ══════════════════════════════════
       CONTENT LAYOUT
    ══════════════════════════════════ */
    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      /* panel-right default */
      justify-content: flex-end;
      padding: 0 5vw;
    }
    .panel-left .content { justify-content: flex-start; }

    /* ── Text panel ── */
    .panel {
      display: flex;
      flex-direction: column;
      align-items: center;          /* centre all elements horizontally */
      gap: clamp(10px, 1.8vh, 22px);
      width: clamp(280px, 40vw, 520px);
    }

    /* ─── Logo ─── */
    .logo {
      height: clamp(28px, 4vw, 52px);
      width: auto;
      object-fit: contain;
    }

    /* ─── Title ─── */
    .title {
      font-family: 'Lalezar', sans-serif;
      font-size: clamp(24px, 3.8vw, 58px);
      line-height: 1.15;
      color: #fff;
      text-align: center;
      text-shadow: 0 2px 24px rgba(0,0,0,0.7);
      width: 100%;
    }

    /* ─── Subtitle ─── */
    .promo-label {
      font-family: 'Lalezar', sans-serif;
      font-size: clamp(13px, 1.3vw, 17px);
      color: #c0b8ff;
      text-align: center;
      letter-spacing: 0.04em;
      width: 100%;
    }

    /* ─── Promo code box ─── */
    .promo-box {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.97);
      border: 2px solid var(--accent);
      border-radius: 50px;
      padding: clamp(8px,1.2vw,14px) clamp(16px,2vw,28px);
      box-shadow: 0 0 22px var(--accent-a45), 0 4px 12px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .promo-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 32px var(--accent-a65), 0 6px 18px rgba(0,0,0,0.35);
    }
    .promo-code {
      font-family: 'Saira', sans-serif;
      font-weight: 800;
      font-size: clamp(18px, 2.4vw, 36px);
      color: #1a1a2e;
      letter-spacing: 0.05em;
      user-select: all;
    }
    .copy-icon {
      display: flex; align-items: center; justify-content: center;
      width: clamp(26px,2.2vw,36px);
      height: clamp(26px,2.2vw,36px);
      background: var(--accent-a06);
      border-radius: 8px;
      flex-shrink: 0;
      transition: background 0.15s;
      color: var(--accent);
    }
    .copy-icon svg { width: 55%; height: 55%; }
    .promo-box:hover .copy-icon { background: var(--accent-a12); }

    /* ─── Copy toast ─── */
    .copy-toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #22c55e; color: #fff;
      font-family: 'Lalezar', sans-serif;
      font-size: 16px;
      padding: 10px 24px;
      border-radius: 50px;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ─── CTA button ─── */
    .cta-wrapper {
      display: flex;
      align-items: center;
      gap: clamp(6px, 0.8vw, 12px);
    }
    .cta-arrow {
      color: #22c55e;
      font-size: clamp(16px, 1.8vw, 26px);
      filter: drop-shadow(0 0 6px #22c55e);
      animation: arrowPulse 1.2s ease-in-out infinite alternate;
    }
    .cta-arrow.r { animation-delay: 0.2s; }
    @keyframes arrowPulse {
      from { opacity: 0.45; transform: scale(0.9); }
      to   { opacity: 1;    transform: scale(1.1); }
    }
    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #15803d 0%, #22c55e 50%, #15803d 100%);
      color: #fff;
      font-family: 'Lalezar', sans-serif;
      font-size: clamp(16px, 2vw, 28px);
      text-decoration: none;
      border-radius: 50px;
      padding: clamp(11px,1.4vw,17px) clamp(28px,3.5vw,58px);
      box-shadow: 0 4px 24px rgba(34,197,94,0.5);
      transition: transform 0.15s, box-shadow 0.15s;
      animation: btnGlow 2s ease-in-out infinite alternate;
      white-space: nowrap;
    }
    .cta-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 32px rgba(34,197,94,0.65);
    }
    @keyframes btnGlow {
      from { box-shadow: 0 4px 24px rgba(34,197,94,0.4); }
      to   { box-shadow: 0 4px 36px rgba(34,197,94,0.7); }
    }

    /* ══════════════════════════════════
       MOBILE — portrait ≤ 700px
       Panel overlays the BOTTOM of the
       full-screen background image.
    ══════════════════════════════════ */
    @media (max-width: 700px) {
      .main {
        /* anchor panel to bottom, image bleeds through above */
        align-items: flex-end;
        justify-content: center;
      }

      /* Mobile gradient: transparent top → dark bottom */
      .bg-overlay,
      .panel-left .bg-overlay {
        background: linear-gradient(
          to bottom,
          rgba(2,0,20,0.00)  0%,
          rgba(2,0,20,0.15) 35%,
          rgba(2,0,20,0.80) 58%,
          rgba(2,0,20,0.97) 75%,
          rgba(2,0,20,1.00) 100%
        );
      }

      .content,
      .panel-left .content {
        justify-content: center;
        align-items: flex-end;
        padding: 0 20px 44px;
      }

      .panel {
        width: 100%;
        max-width: 380px;
        align-items: center;
        gap: clamp(10px, 3vw, 18px);
      }

      .title       { font-size: clamp(22px, 6.5vw, 36px); }
      .promo-label { font-size: clamp(12px, 3.5vw, 15px); }
      .promo-code  { font-size: clamp(18px, 5.5vw, 28px); }
      .cta-btn     { font-size: clamp(16px, 5vw, 22px); }

      /* Glows: position at bottom on mobile */
      .glow-1 { top: auto; bottom: 40%; right: -60px; }
      .glow-2 { bottom: 20%; right: 10px; }
    }
  </style>
</head>
<body>
<div class="main {{HAS_IMAGE}} {{PANEL_SIDE}}" id="main">

  <!-- ── Background ── -->
  <div class="bg">
    <div class="bg-img" style="--bg-url: url('{{BG_IMAGE_URL}}')"></div>
    <div class="bg-overlay"></div>
    <div class="bg-vignette"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <!-- ── UI Panel ── -->
  <div class="content">
    <div class="panel">
      {{ELEMENTS_HTML}}
    </div>
  </div>

</div>

<div class="copy-toast" id="copyToast">Copied! ✓</div>

<script>
  function copyPromo() {
    const code = document.getElementById('promoCode').textContent;
    navigator.clipboard.writeText(code).then(function () {
      const t = document.getElementById('copyToast');
      t.classList.add('show');
      setTimeout(function () { t.classList.remove('show'); }, 1800);
    });
  }
</script>
</body>
</html>
